[build-system]
requires = ["setuptools>=78.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greco"
version = "1.0"
description = "Web-based cryo-electron tomography from detector movies to tomograms and subtomogram averages, with GPU processing and Slurm job management."
keywords = ["cryo-ET", "electron-tomography", "subtomogram-averaging", "image-processing"]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "licenses/**/*.txt", "licenses/THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
# Tested production versions. Install Torch with the CUDA 12.8 wheel index;
# the complete transitive environment is recorded under runtime-locks/.
dependencies = [
  "numpy==2.4.6", "scipy==1.17.1", "mrcfile==1.5.4",
  "pillow==12.3.0", "tifffile==2026.3.3", "imagecodecs==2026.3.6",
  "scikit-image==0.26.0", "numba==0.68.0", "healpix==2025.1",
  "monai==1.6.1",
  "torch==2.10.0+cu128", "cupy-cuda12x==13.6.0",
]

[project.scripts]
greco = "greco.runtime:main"

[tool.setuptools.packages.find]
include = ["greco*"]

[tool.setuptools.package-data]
"greco.web" = ["static/*"]
"greco" = ["native/*"]
"greco._numerics" = ["native/*"]
"greco.sta" = ["vendor/liblbfgs/*"]
"greco.picker" = ["*.cu", "_data/*.npz"]

[tool.setuptools.exclude-package-data]
"*" = ["*.so", "*.build.json"]
